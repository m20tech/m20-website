# GENERATED from cms/schema.mjs by `npm run cms:sync` — do not edit by hand.
# PagesCMS (https://pagescms.org) reads this file to build the editing UI.
media:
  - name: images
    label: Site images
    input: assets
    output: /assets
  - name: covers
    label: "Artwork: covers"
    input: assets/artwork/covers
    output: /assets/artwork/covers
    extensions:
      - svg
      - png
      - jpg
      - jpeg
      - webp
  - name: illustrations
    label: "Artwork: illustrations"
    input: assets/artwork/illustrations
    output: /assets/artwork/illustrations
    extensions:
      - svg
      - png
      - jpg
      - jpeg
      - webp
  - name: spots
    label: "Artwork: spots"
    input: assets/artwork/spots
    output: /assets/artwork/spots
    extensions:
      - svg
      - png
      - jpg
      - jpeg
      - webp
  - name: app-icons
    label: "Artwork: app icons"
    input: assets/artwork/app-icons
    output: /assets/artwork/app-icons
    extensions:
      - svg
      - png
      - jpg
      - jpeg
      - webp
content:
