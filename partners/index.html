<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
[[> head]]
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/image-slot.js"></script>
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
    @media (max-width: 560px) { .partner-row { grid-template-columns: 112px minmax(0,1fr) !important; gap: 16px !important; } }
  </style>
</helmet>

<div style="background:#FAF7F4;color:#14171C;font-family:'Source Sans 3', system-ui, sans-serif;font-size:17px;line-height:1.65;">

  <dc-import name="Header" active-page="partners" hint-size="100%,76px"></dc-import>

  <section style="background:#14171C;color:#FAF7F4;padding-block:clamp(40px,5vw,64px);">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <h1 style="font:700 clamp(38px,5.4vw,60px)/1.15 'Source Serif 4', Georgia, serif;color:#fff;margin:0 0 18px;letter-spacing:-0.01em;max-width:760px;text-wrap:balance;">
        [[ hero.title ]]
      </h1>
      <p style="color:#D5D9E1;margin:0;max-width:640px;font-size:18px;text-wrap:pretty;">
        [[ hero.intro ]]
      </p>
    </div>
  </section>

  <section style="padding-block:clamp(40px,5vw,64px);">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <!-- Ledger of partners: logo tile, name, blurb, and a named link -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));column-gap:clamp(32px,4.5vw,64px);border-bottom:1px solid #E4DCD3;">

        [[#each partners]]
        <div class="partner-row" style="display:grid;grid-template-columns:168px minmax(0,1fr);gap:22px;align-items:start;padding:24px 0;border-top:1px solid #E4DCD3;">
          <div style="background:#fff;border:1px solid #E4DCD3;border-radius:14px;height:92px;display:flex;align-items:center;justify-content:center;padding:8px 10px;box-sizing:border-box;">
            <img src="[[ logo ]]" alt="[[ logoAlt ]]" loading="lazy" style="max-height:64px;max-width:100%;width:auto;height:auto;object-fit:contain;display:block;">
          </div>
          <div>
            <h2 style="font:600 21px/1.25 'Source Serif 4', Georgia, serif;margin:0 0 6px;">[[ name ]]</h2>
            <p style="color:#5A6270;margin:0 0 10px;font-size:16px;max-width:68ch;text-wrap:pretty;">[[ text ]]</p>
            <a href="[[ url ]]" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;font:600 15px 'Source Sans 3', system-ui, sans-serif;color:#C0392B;" style-hover="color:#96271C;text-decoration:underline;">
              [[ linkLabel ]]
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </a>
          </div>
        </div>

        [[/each]]
      </div>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { year: new Date().getFullYear() };
  }
}

</script>
</body>
</html>
