<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/image-slot.js"></script>
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</helmet>

<div style="background:#FAF7F4;color:#14171C;font-family:'Source Sans 3', system-ui, sans-serif;font-size:17px;line-height:1.65;">

  <dc-import name="Header" active-page="partners" hint-size="100%,76px"></dc-import>

  <section style="background:#14171C;color:#FAF7F4;padding-block:clamp(40px,5vw,64px);">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <p style="font:600 13px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#E8A04C;display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <span style="width:34px;height:2px;background:#E8A04C;"></span>[[ hero.eyebrow ]]
      </p>
      <h1 style="font:700 clamp(38px,5.4vw,60px)/1.15 'Source Serif 4', Georgia, serif;color:#fff;margin:0 0 18px;letter-spacing:-0.01em;max-width:760px;">[[ hero.title ]]</h1>
      <p style="color:#D5D9E1;margin:0;max-width:640px;font-size:18px;">[[ hero.intro ]]</p>
    </div>
  </section>

  <section style="padding-block:clamp(40px,5vw,64px);">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,3vw,32px);">

        [[#each partners]]
        <div style="background:#fff;border:1px solid #E4DCD3;border-radius:22px;padding:26px 26px 24px;display:flex;flex-direction:column;transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease" style-hover="border-color:#C0392B;box-shadow:0 18px 40px rgba(20,23,28,.10);transform:translateY(-4px)">
          <div style="display:flex;align-items:center;justify-content:center;height:76px;margin-bottom:18px;">
            <img src="[[ logo ]]" alt="[[ logoAlt ]]" style="max-height:70px;max-width:100%;width:auto;height:auto;object-fit:contain;display:block;">
          </div>
          <h2 style="font:600 22px/1.2 'Source Serif 4', Georgia, serif;margin:0 0 12px;">[[ name ]]</h2>
          <p style="color:#5A6270;margin:0 0 20px;font-size:15.5px;">[[ text ]]</p>
          <a href="[[ url ]]" target="_blank" rel="noopener" style="margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 18px;font:600 14.5px 'Source Sans 3', system-ui, sans-serif;border-radius:999px;border:2px solid #14171C;color:#14171C;white-space:nowrap;" style-hover="background:#14171C;color:#fff;">[[ linkLabel ]]</a>
        </div>

        [[/each]]
      </div>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { year: new Date().getFullYear() };
  }
}

</script>
</body>
</html>
