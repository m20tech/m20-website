<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/m20-website/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</helmet>

<div style="background:#FAF7F4;color:#14171C;font-family:'Source Sans 3', system-ui, sans-serif;font-size:17px;line-height:1.65;min-height:100vh;display:flex;flex-direction:column;">

  <dc-import name="Header" active-page="contact" hint-size="100%,76px"></dc-import>

  <section style="background:#14171C;color:#FAF7F4;padding-block:clamp(44px,5.5vw,72px);flex:1 0 auto;">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,4.5vw,64px);align-items:start;">
      <div>
        <p style="font:600 13px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#E8A04C;display:flex;align-items:center;gap:12px;margin:0 0 18px;">
          <span style="width:34px;height:2px;background:#E8A04C;"></span>Get in touch
        </p>
        <h2 style="font:600 clamp(34px,4.6vw,56px)/1.12 'Source Serif 4', Georgia, serif;color:#fff;margin:0 0 .5em;letter-spacing:-0.01em;">Contact Us</h2>
        <p style="color:#C9CDD6;margin:0 0 1em;">For a closer look at Rovo, the possibilities of AI with your team, or any of our services — drop us a line.</p>
        <p style="margin:0;"><a href="mailto:sales@m20tech.com" style="color:#F5C98F;">Prefer email? sales@m20tech.com</a></p>
      </div>

      <form style="background:#fff;color:#14171C;border-radius:22px;padding:clamp(28px,4vw,44px);box-shadow:0 40px 90px rgba(0,0,0,.4);" onsubmit="{{ handleSubmit }}" novalidate="">
        <input type="hidden" name="access_key" value="5c35ed9d-6e3b-4cfd-9a99-98f1a7adb220">
        <div style="display:grid;gap:20px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:20px;">
          <div>
            <label for="firstName" style="display:block;font:600 13.5px 'Source Sans 3', system-ui, sans-serif;margin-bottom:7px;color:#23282F;">First name <span style="color:#C0392B;">*</span></label>
            <input type="text" id="firstName" name="firstName" required="" autocomplete="given-name" value="{{ firstName }}" onchange="{{ onField }}" style="width:100%;font:400 16px 'Source Sans 3', system-ui, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ firstNameBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
          </div>
          <div>
            <label for="lastName" style="display:block;font:600 13.5px 'Source Sans 3', system-ui, sans-serif;margin-bottom:7px;color:#23282F;">Last name <span style="color:#C0392B;">*</span></label>
            <input type="text" id="lastName" name="lastName" required="" autocomplete="family-name" value="{{ lastName }}" onchange="{{ onField }}" style="width:100%;font:400 16px 'Source Sans 3', system-ui, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ lastNameBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
          </div>
        </div>
        <div>
          <label for="email" style="display:block;font:600 13.5px 'Source Sans 3', system-ui, sans-serif;margin-bottom:7px;color:#23282F;">Email <span style="color:#C0392B;">*</span></label>
          <input type="email" id="email" name="email" required="" autocomplete="email" value="{{ email }}" onchange="{{ onField }}" style="width:100%;font:400 16px 'Source Sans 3', system-ui, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ emailBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
        </div>
        <div>
          <label for="subject" style="display:block;font:600 13.5px 'Source Sans 3', system-ui, sans-serif;margin-bottom:7px;color:#23282F;">Subject <span style="color:#C0392B;">*</span></label>
          <input type="text" id="subject" name="subject" required="" value="{{ subject }}" onchange="{{ onField }}" style="width:100%;font:400 16px 'Source Sans 3', system-ui, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ subjectBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
        </div>
        <div>
          <label for="message" style="display:block;font:600 13.5px 'Source Sans 3', system-ui, sans-serif;margin-bottom:7px;color:#23282F;">Message <span style="color:#C0392B;">*</span></label>
          <textarea id="message" name="message" rows="5" required="" onchange="{{ onField }}" style="width:100%;font:400 16px 'Source Sans 3', system-ui, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ messageBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;resize:vertical;min-height:120px;" value="{{ message }}"></textarea>
        </div>
        <div class="h-captcha" data-captcha="true"></div>
        <button type="submit" disabled="{{ submitting }}" style="margin-top:4px;width:100%;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 20px;font:600 15px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.02em;border-radius:999px;border:0;background:#C0392B;color:#fff;cursor:pointer;" style-hover="background:#96271C;box-shadow:0 8px 24px rgba(192,57,43,.28);">{{ submitLabel }}</button>
        <p role="status" style="margin:0;font-size:14.5px;min-height:22px;color:{{ statusColor }};">{{ statusText }}</p>
        </div>
      </form>

      <sc-if value="{{ showThanks }}" hint-placeholder-val="{{ false }}">
        <div style="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,23,28,.6);backdrop-filter:blur(2px);" onclick="{{ closeThanks }}">
          <div role="dialog" aria-modal="true" aria-labelledby="thanksTitle" onclick="{{ stopClick }}" style="background:#fff;color:#14171C;border-radius:22px;padding:clamp(32px,5vw,44px);max-width:420px;width:100%;box-shadow:0 40px 90px rgba(0,0,0,.4);text-align:center;">
            <p id="thanksTitle" style="font:700 26px/1.2 'Source Serif 4', Georgia, serif;margin:0 0 12px;">Thanks for reaching out!</p>
            <p style="color:#5A6270;margin:0 0 28px;">A member of the M20 Tech team will get back to you in shortly.</p>
            <button type="button" onclick="{{ closeThanks }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 28px;font:600 15px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.02em;border-radius:999px;border:0;background:#C0392B;color:#fff;cursor:pointer;" style-hover="background:#96271C;box-shadow:0 8px 24px rgba(192,57,43,.28);">Close</button>
          </div>
        </div>
      </sc-if>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const WEB3FORMS_ENDPOINT = "https://api.web3forms.com/submit";
const SUBMIT_ERROR_TEXT = "Something went wrong sending your message. Please try again, or email sales@m20tech.com directly.";

class Component extends DCLogic {
  state = {
    firstName: "", lastName: "", email: "", subject: "", message: "",
    invalid: {}, statusText: "", statusOk: false,
    submitting: false, showThanks: false
  };

  componentDidMount() {
    this._onKey = (e) => {
      if (e.key === "Escape" && this.state.showThanks) this.setState({ showThanks: false });
    };
    document.addEventListener("keydown", this._onKey);
  }
  componentWillUnmount() {
    document.removeEventListener("keydown", this._onKey);
  }

  onField = (e) => {
    const { name, value } = e.target;
    this.setState(s => ({ [name]: value, invalid: { ...s.invalid, [name]: false } }));
  };

  handleSubmit = (e) => {
    e.preventDefault();
    const required = ["firstName", "lastName", "email", "subject", "message"];
    const invalid = {};
    let valid = true;
    required.forEach(f => {
      const v = (this.state[f] || "").trim();
      const ok = f === "email" ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) : v !== "";
      if (!ok) { invalid[f] = true; valid = false; }
    });
    if (!valid) {
      this.setState({ invalid, statusText: "Please fill in the highlighted fields (valid email required).", statusOk: false });
      return;
    }

    // FormData reads the live form DOM, so it automatically carries the
    // access_key hidden field and (once solved) the hCaptcha response
    // token the widget injects, on top of the five visible fields.
    const formData = new FormData(e.target);
    formData.set("name", (this.state.firstName + " " + this.state.lastName).trim());

    this.setState({ invalid: {}, submitting: true, statusText: "", statusOk: false });

    fetch(WEB3FORMS_ENDPOINT, {
      method: "POST",
      headers: { Accept: "application/json" },
      body: formData
    })
      .then(res => res.json())
      .then(data => {
        if (data && data.success) {
          this.setState({
            submitting: false, showThanks: true, statusText: "",
            firstName: "", lastName: "", email: "", subject: "", message: ""
          });
          try { window.hcaptcha && window.hcaptcha.reset && window.hcaptcha.reset(); } catch (err) {}
        } else {
          this.setState({
            submitting: false, statusOk: false,
            statusText: (data && data.message) || SUBMIT_ERROR_TEXT
          });
        }
      })
      .catch(() => {
        this.setState({ submitting: false, statusOk: false, statusText: SUBMIT_ERROR_TEXT });
      });
  };

  closeThanks = () => this.setState({ showThanks: false });
  stopClick = (e) => e.stopPropagation();

  renderVals() {
    const s = this.state;
    const borderFor = (f) => s.invalid[f] ? "#96271C" : "#E4DCD3";
    return {
      year: new Date().getFullYear(),
      firstName: s.firstName, lastName: s.lastName, email: s.email, subject: s.subject, message: s.message,
      firstNameBorder: borderFor("firstName"), lastNameBorder: borderFor("lastName"),
      emailBorder: borderFor("email"), subjectBorder: borderFor("subject"), messageBorder: borderFor("message"),
      statusText: s.statusText, statusColor: s.statusOk ? "#1E7A46" : "#96271C",
      submitting: s.submitting, submitLabel: s.submitting ? "Sending…" : "Submit",
      showThanks: s.showThanks, closeThanks: this.closeThanks, stopClick: this.stopClick,
      onField: this.onField, handleSubmit: this.handleSubmit
    };
  }
}

</script>
<script src="https://web3forms.com/client/script.js" async defer></script>
</body>
</html>
