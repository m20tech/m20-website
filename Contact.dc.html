<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</helmet>

<div style="background:#FAF7F4;color:#14171C;font-family:Inter, sans-serif;font-size:17px;line-height:1.65;">

  <dc-import name="Header" active-page="contact" hint-size="100%,76px"></dc-import>

  <section style="background:#14171C;color:#FAF7F4;padding-block:clamp(56px,7vw,96px);">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(40px,6vw,88px);align-items:start;">
      <div>
        <p style="font:600 13px Inter, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#E8A04C;display:flex;align-items:center;gap:12px;margin:0 0 18px;">
          <span style="width:34px;height:2px;background:#E8A04C;"></span>Get in touch
        </p>
        <h2 style="font:500 clamp(34px,4.6vw,56px)/1.12 Fraunces, Georgia, serif;color:#fff;margin:0 0 .5em;letter-spacing:-0.01em;">Contact Us</h2>
        <p style="color:#C9CDD6;margin:0 0 1em;">For a closer look at Rovo, the possibilities of AI with your team, or any of our services — drop us a line.</p>
        <p style="margin:0;"><a href="mailto:sales@m20tech.com" style="color:#F5C98F;">Prefer email? sales@m20tech.com</a></p>
      </div>

      <form style="background:#fff;color:#14171C;border-radius:22px;padding:clamp(28px,4vw,44px);box-shadow:0 40px 90px rgba(0,0,0,.4);" onsubmit="{{ handleSubmit }}" novalidate="">
        <div style="display:grid;gap:20px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:20px;">
          <div>
            <label for="firstName" style="display:block;font:600 13.5px Inter, sans-serif;margin-bottom:7px;color:#23282F;">First name <span style="color:#C0392B;">*</span></label>
            <input type="text" id="firstName" name="firstName" required="" autocomplete="given-name" value="{{ firstName }}" onchange="{{ onField }}" style="width:100%;font:400 16px Inter, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ firstNameBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
          </div>
          <div>
            <label for="lastName" style="display:block;font:600 13.5px Inter, sans-serif;margin-bottom:7px;color:#23282F;">Last name <span style="color:#C0392B;">*</span></label>
            <input type="text" id="lastName" name="lastName" required="" autocomplete="family-name" value="{{ lastName }}" onchange="{{ onField }}" style="width:100%;font:400 16px Inter, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ lastNameBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
          </div>
        </div>
        <div>
          <label for="email" style="display:block;font:600 13.5px Inter, sans-serif;margin-bottom:7px;color:#23282F;">Email <span style="color:#C0392B;">*</span></label>
          <input type="email" id="email" name="email" required="" autocomplete="email" value="{{ email }}" onchange="{{ onField }}" style="width:100%;font:400 16px Inter, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ emailBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
        </div>
        <div>
          <label for="subject" style="display:block;font:600 13.5px Inter, sans-serif;margin-bottom:7px;color:#23282F;">Subject <span style="color:#C0392B;">*</span></label>
          <input type="text" id="subject" name="subject" required="" value="{{ subject }}" onchange="{{ onField }}" style="width:100%;font:400 16px Inter, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ subjectBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;">
        </div>
        <div>
          <label for="message" style="display:block;font:600 13.5px Inter, sans-serif;margin-bottom:7px;color:#23282F;">Message <span style="color:#C0392B;">*</span></label>
          <textarea id="message" name="message" rows="5" required="" onchange="{{ onField }}" style="width:100%;font:400 16px Inter, sans-serif;color:#14171C;background:#FAF7F4;border:1.5px solid {{ messageBorder }};border-radius:10px;padding:13px 15px;box-sizing:border-box;resize:vertical;min-height:120px;" value="{{ message }}"></textarea>
        </div>
        <button type="submit" style="margin-top:4px;width:100%;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 20px;font:600 15px Inter, sans-serif;letter-spacing:.02em;border-radius:999px;border:0;background:#C0392B;color:#fff;cursor:pointer;" style-hover="background:#96271C;box-shadow:0 8px 24px rgba(192,57,43,.28);">Submit</button>
        <p role="status" style="margin:0;font-size:14.5px;min-height:22px;color:{{ statusColor }};">{{ statusText }}</p>
        </div>
      </form>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    firstName: "", lastName: "", email: "", subject: "", message: "",
    invalid: {}, statusText: "", statusOk: false
  };
  onField = (e) => {
    const { name, value } = e.target;
    this.setState(s => ({ [name]: value, invalid: { ...s.invalid, [name]: false } }));
  };
  handleSubmit = (e) => {
    e.preventDefault();
    const required = ["firstName", "lastName", "email", "subject", "message"];
    const invalid = {};
    let valid = true;
    required.forEach(f => {
      const v = (this.state[f] || "").trim();
      const ok = f === "email" ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) : v !== "";
      if (!ok) { invalid[f] = true; valid = false; }
    });
    if (!valid) {
      this.setState({ invalid, statusText: "Please fill in the highlighted fields (valid email required).", statusOk: false });
      return;
    }
    this.setState({
      invalid: {}, statusText: "Thanks — your message is ready to send. Connect this form to your email service to go live.",
      statusOk: true, firstName: "", lastName: "", email: "", subject: "", message: ""
    });
  };
  renderVals() {
    const s = this.state;
    const borderFor = (f) => s.invalid[f] ? "#96271C" : "#E4DCD3";
    return {
      year: new Date().getFullYear(),
      firstName: s.firstName, lastName: s.lastName, email: s.email, subject: s.subject, message: s.message,
      firstNameBorder: borderFor("firstName"), lastNameBorder: borderFor("lastName"),
      emailBorder: borderFor("email"), subjectBorder: borderFor("subject"), messageBorder: borderFor("message"),
      statusText: s.statusText, statusColor: s.statusOk ? "#1E7A46" : "#96271C",
      onField: this.onField, handleSubmit: this.handleSubmit
    };
  }
}

</script>
</body>
</html>
