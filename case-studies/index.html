<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
[[> head]]
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</helmet>

<div style="background:#FAF7F4;color:#14171C;font-family:'Source Sans 3', system-ui, sans-serif;font-size:17px;line-height:1.65;min-height:100vh;display:flex;flex-direction:column;">

  <dc-import name="Header" active-page="case-studies" hint-size="100%,76px"></dc-import>

  <section style="padding-block:clamp(44px,5.5vw,72px);flex:1 0 auto;">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <p style="font:600 13px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C0392B;display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <span style="width:34px;height:2px;background:#C0392B;"></span>[[ eyebrow ]]
      </p>
      <h2 style="font:600 clamp(34px,4.6vw,56px)/1.12 'Source Serif 4', Georgia, serif;margin:0 0 .5em;letter-spacing:-0.01em;max-width:680px;">[[ title ]]</h2>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(20px,3vw,36px);margin-top:32px;">

        [[#each studies]]
        <a href="[[ href ]]" style="background:#fff;border:1px solid #E4DCD3;border-radius:22px;padding:30px 32px;display:flex;flex-direction:column;color:#14171C;" style-hover="transform:translateY(-6px);box-shadow:0 24px 48px rgba(20,23,28,.10);border-color:#C0392B;">
          [[#if spot]]
          <img src="[[ spot ]]" alt="" width="240" height="240"
            style="display:block;width:96px;height:96px;margin:0 0 14px -7px;">
          [[/if]]
          <p style="font:600 12px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#C0392B;margin:0 0 12px;">[[ category ]]</p>
          <h3 style="font:600 clamp(21px,2.2vw,26px)/1.12 'Source Serif 4', Georgia, serif;margin:0 0 10px;">[[ title ]]</h3>
          <p style="color:#5A6270;margin:0 0 20px;">[[ summary ]]</p>
          <span style="margin-top:auto;font:600 14.5px 'Source Sans 3', system-ui, sans-serif;color:#C0392B;">[[ linkLabel ]]</span>
        </a>

        [[/each]]
      </div>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { year: new Date().getFullYear() };
  }
}

</script>
</body>
</html>
