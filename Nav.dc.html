<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
</helmet>
<nav style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:74px;padding:0 max(24px,calc((100% - 1240px)/2));background:rgba(245,244,241,0.82);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid #E4E2DD;font-family:'DM Sans',sans-serif">
  <a href="Home.dc.html" style="display:flex;align-items:baseline;gap:1px;text-decoration:none;font-family:'Sora',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.03em;color:#16161A">
    <span>M2</span><span style="color:#E12B1C">0</span><span style="margin-left:9px;width:7px;height:7px;border-radius:50%;background:#E12B1C;align-self:center"></span>
  </a>
  <div style="display:flex;align-items:center;gap:6px">
    <div style="position:relative;display:flex;flex-direction:column;align-items:center">
      <a href="Home.dc.html" style="text-decoration:none;font-size:15px;font-weight:500;color:#16161A;padding:8px 14px">Home</a>
      <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:-1px;width:18px;height:2.5px;border-radius:2px;background:#E12B1C"></span></sc-if>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center">
      <a href="Atlassian-Services.dc.html" style="text-decoration:none;font-size:15px;font-weight:500;color:#16161A;padding:8px 14px">Atlassian Services</a>
      <sc-if value="{{ isServices }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:-1px;width:18px;height:2.5px;border-radius:2px;background:#E12B1C"></span></sc-if>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center">
      <a href="Atlassian-Rovo.dc.html" style="text-decoration:none;font-size:15px;font-weight:500;color:#16161A;padding:8px 14px">Rovo AI</a>
      <sc-if value="{{ isRovo }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;bottom:-1px;width:18px;height:2.5px;border-radius:2px;background:#E12B1C"></span></sc-if>
    </div>
    <a href="Contact.dc.html" style="margin-left:10px;text-decoration:none;font-size:15px;font-weight:600;color:#fff;background:#E12B1C;padding:11px 22px;border-radius:100px;transition:background .18s" style-hover="background:#BE2114">Contact Us</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;rovo&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "home";
    return {
      isHome: a === "home",
      isServices: a === "services",
      isRovo: a === "rovo",
      isContact: a === "contact",
    };
  }
}
</script>
</body>
</html>
