[[#if hero.image]]
<style>
  @media (max-width: 760px) { .hero-bg { width: 100% !important; opacity: .5; } }
</style>
<div style="position:absolute;inset:0;background:linear-gradient(100deg, rgba(10,12,16,.9) 0%, rgba(10,12,16,.72) 40%, rgba(10,12,16,.3) 70%, rgba(10,12,16,.1) 100%);pointer-events:none;"></div>
<div class="hero-bg" style="position:absolute;top:0;right:0;bottom:0;width:62%;pointer-events:none;-webkit-mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 22%, rgba(0,0,0,.85) 52%, #000 78%);mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 22%, rgba(0,0,0,.85) 52%, #000 78%);">
  <img src="[[ hero.image ]]" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center;display:block;">
</div>
[[/if]]
