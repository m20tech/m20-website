<title>[[ seo.title ]]</title>
<meta name="description" content="[[ seo.description ]]">
<link rel="canonical" href="[[ build.url ]]">
[[#if seo.noindex]]
<meta name="robots" content="noindex, nofollow">
[[else]]
[[#if build.preview]]
<meta name="robots" content="noindex, nofollow">
[[/if]]
[[/if]]
<link rel="icon" href="[[ site.favicon ]]">
<meta name="theme-color" content="#C0392B">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="[[ site.siteName ]]">
<meta property="og:title" content="[[ seo.title ]]">
<meta property="og:description" content="[[ seo.description ]]">
<meta property="og:url" content="[[ build.url ]]">
<meta property="og:image" content="[[ site.siteUrl ]][[#if seo.image]][[ seo.image ]][[else]][[ site.defaultImage ]][[/if]]">
<meta name="twitter:card" content="summary_large_image">
[[#if build.isHome]]
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":[[json site.siteName]],"url":[[json site.siteUrl]],"logo":"[[ site.siteUrl ]][[ site.logo ]]","sameAs":[[json site.sameAs]]}</script>
[[/if]]
