<!doctype html>
<!--
  M20 home hero: the abstract red/dark network mesh, as a reproducible source.
  Render with scripts/backgrounds/home-hero.py, which calls render.sh and
  encodes the AVIF/WebP/JPG set. ?v= picks the variant and its canvas:

    wide     1920x800   desktop hero (> 900px): calm left half, dense
                        cluster and maroon glow on the right
    compact  1200x1200  hero at 900px and below, where the copy covers the
                        whole width: faint mesh, glows kept to the corners
    share    1200x630   the home page's social share image

  Palette only: ink #14171C ground, the muted greys for strands and nodes,
  maroon #7A1E15 / #96271C for glows, brand red #C0392B on a few node cores.
  Seeded PRNG, so every render of a variant is identical.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: #14171C; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const V = new URLSearchParams(location.search).get("v") || "wide";
const CFG = {
  wide: {
    w: 1920, h: 800, seed: 7,
    focus: [0.75, 0.5], spread: [0.19, 0.46], cluster: 110, calm: 0.5,
    glows: [[0.76, 0.48, 0.34, 0.55], [0.93, 0.16, 0.16, 0.3]],
    lit: 5,
  },
  compact: {
    w: 1200, h: 1200, seed: 11,
    focus: [0.86, 0.9], spread: [0.17, 0.14], cluster: 42, calm: 0.0,
    glows: [[0.9, 0.95, 0.42, 0.45], [1.0, 0.04, 0.22, 0.22]],
    lit: 2, faint: 0.55,
  },
  share: {
    w: 1200, h: 630, seed: 5,
    focus: [0.64, 0.5], spread: [0.24, 0.46], cluster: 96, calm: 0.25,
    glows: [[0.64, 0.5, 0.42, 0.6]],
    lit: 5,
  },
}[V];
const { w: W, h: H } = CFG;
document.body.style.width = W + "px";
document.body.style.height = H + "px";
const svgEl = document.getElementById("s");
svgEl.setAttribute("width", W);
svgEl.setAttribute("height", H);
svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const r = rng(CFG.seed);
const gauss = () => {
  let u = 0, v = 0;
  while (!u) u = r();
  while (!v) v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};
const f = (n) => n.toFixed(1);

// How visible art may be at x: near zero across the calm left, full on the right.
const fade = (x) => {
  const t = (x / W - CFG.calm) / 0.22;
  return Math.max(0.08, Math.min(1, t)) * (CFG.faint || 1);
};

let defs = `
  <radialGradient id="glow">
    <stop offset="0" stop-color="#96271C" stop-opacity=".55"/>
    <stop offset=".45" stop-color="#7A1E15" stop-opacity=".22"/>
    <stop offset="1" stop-color="#7A1E15" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ember">
    <stop offset="0" stop-color="#C0392B" stop-opacity=".7"/>
    <stop offset=".3" stop-color="#96271C" stop-opacity=".28"/>
    <stop offset="1" stop-color="#96271C" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="node" cx=".38" cy=".34" r=".7">
    <stop offset="0" stop-color="#9AA1AD"/>
    <stop offset=".55" stop-color="#5A6270"/>
    <stop offset="1" stop-color="#23282F"/>
  </radialGradient>
  <filter id="far" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="near" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.4"/></filter>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75">
    <stop offset=".6" stop-color="#14171C" stop-opacity="0"/>
    <stop offset="1" stop-color="#14171C" stop-opacity=".7"/>
  </radialGradient>`;

let body = `<rect width="${W}" height="${H}" fill="#14171C"/>`;

// Maroon glows behind the focal cluster (and one quieter corner glow).
for (const [gx, gy, gr, op] of CFG.glows) {
  body += `<ellipse cx="${f(gx * W)}" cy="${f(gy * H)}" rx="${f(gr * W)}" ry="${f(gr * W * 0.62)}"
    fill="url(#glow)" opacity="${op / 0.55}"/>`;
}

// Layer 1: a faint far mesh over the whole canvas (the "faint mesh" ground).
const S = Math.round(Math.max(W, H) / 11);
const cols = Math.ceil(W / S) + 3, rows = Math.ceil(H / S) + 3;
const P = [];
for (let i = 0; i < cols; i++) {
  P[i] = [];
  for (let j = 0; j < rows; j++) {
    P[i][j] = { x: (i - 1) * S + (r() - 0.5) * S * 0.8, y: (j - 1) * S + (r() - 0.5) * S * 0.8 };
  }
}
let far = "";
const farSeg = (a, b) => {
  const o = 0.11 * fade((a.x + b.x) / 2);
  far += `<path d="M${f(a.x)} ${f(a.y)}L${f(b.x)} ${f(b.y)}" stroke="#D5D9E1" stroke-opacity="${o.toFixed(3)}"/>`;
};
for (let i = 0; i < cols; i++) {
  for (let j = 0; j < rows; j++) {
    if (i + 1 < cols) farSeg(P[i][j], P[i + 1][j]);
    if (j + 1 < rows) farSeg(P[i][j], P[i][j + 1]);
    if (i + 1 < cols && j + 1 < rows) r() < 0.5 ? farSeg(P[i][j], P[i + 1][j + 1]) : farSeg(P[i + 1][j], P[i][j + 1]);
    const p = P[i][j];
    far += `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="2.6" fill="#9AA1AD" fill-opacity="${(0.2 * fade(p.x)).toFixed(3)}"/>`;
  }
}
body += `<g filter="url(#far)" stroke-width="1.2" fill="none">${far}</g>`;

// Layer 2: the focal cluster, denser toward the focus, joined to near neighbours.
const [fx, fy] = CFG.focus, [sx, sy] = CFG.spread;
const N = [];
for (let tries = 0; N.length < CFG.cluster && tries < 4000; tries++) {
  const x = (fx + gauss() * sx) * W, y = (fy + gauss() * sy) * H;
  if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
  if (x < CFG.calm * W) continue;
  if (N.some((n) => Math.hypot(n.x - x, n.y - y) < Math.min(W, H) * 0.058)) continue;
  N.push({ x, y, d: r() });
}
const edges = new Set();
N.forEach((a, i) => {
  N.map((b, j) => [Math.hypot(a.x - b.x, a.y - b.y), j])
    .filter(([, j]) => j !== i).sort((p, q) => p[0] - q[0]).slice(0, r() < 0.4 ? 4 : 3)
    .forEach(([, j]) => edges.add(i < j ? `${i}-${j}` : `${j}-${i}`));
});
// The lit nodes: closest to the focus, so the warmth gathers there.
const lit = new Set(N.map((n, i) => [Math.hypot(n.x / W - fx, n.y / H - fy), i])
  .sort((p, q) => p[0] - q[0]).slice(0, CFG.lit).map(([, i]) => i));

let strands = "";
for (const e of edges) {
  const [i, j] = e.split("-").map(Number), a = N[i], b = N[j];
  const warm = lit.has(i) || lit.has(j);
  const col = warm ? "#96271C" : (r() < 0.35 ? "#7A1E15" : "#5A6270");
  const o = (warm ? 0.9 : 0.55) * fade((a.x + b.x) / 2);
  strands += `<path d="M${f(a.x)} ${f(a.y)}L${f(b.x)} ${f(b.y)}" stroke="${col}" stroke-opacity="${o.toFixed(3)}"/>`;
}
body += `<g filter="url(#near)" stroke-width="2" fill="none" stroke-linecap="round">${strands}</g>`;

let nodes = "";
N.forEach((n, i) => {
  const o = fade(n.x);
  const rad = 4 + n.d * 5;
  if (lit.has(i)) {
    nodes += `<circle cx="${f(n.x)}" cy="${f(n.y)}" r="${f(rad * 7)}" fill="url(#ember)" opacity="${(0.9 * o).toFixed(2)}"/>`;
    nodes += `<circle cx="${f(n.x)}" cy="${f(n.y)}" r="${f(rad * 0.95)}" fill="#C0392B" opacity="${o.toFixed(2)}"/>`;
  } else {
    nodes += `<circle cx="${f(n.x)}" cy="${f(n.y)}" r="${f(rad)}" fill="url(#node)" opacity="${(0.85 * o).toFixed(2)}"/>`;
  }
});
body += `<g filter="url(#near)">${nodes}</g>`;

// Layer 3: a few large, out-of-focus foreground nodes (the photo's depth of field).
let fg = "";
for (let k = 0; k < 9; k++) {
  const x = (fx + gauss() * sx * 1.3) * W, y = (fy + gauss() * sy * 1.2) * H;
  if (x < CFG.calm * W + 120) continue;
  fg += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(16 + r() * 16)}" fill="url(#node)" opacity="${(0.35 * fade(x)).toFixed(2)}"/>`;
}
defs += `<filter id="fg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>`;
body += `<g filter="url(#fg)">${fg}</g>`;
body += `<rect width="${W}" height="${H}" fill="url(#vig)"/>`;

svgEl.innerHTML = `<defs>${defs}</defs>${body}`;
</script>
</body>
</html>
