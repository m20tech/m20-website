<!doctype html>
<!-- M20 video background: "City": window wall onto a dusk skyline. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=block"
  rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden;
    position: relative; background: #23282F; }
  svg { display: block; position: absolute; inset: 0; filter: blur(0.6px); }
</style>
<script src="scenes.js"></script>
<script src="lockup.js"></script>
</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"
  xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const GW = 1480, GB = 860;   // glass wall: x 0..GW, y 0..GB

// Three skyline layers, far to near; nearer ones get lit windows.
function skyline(seed, base, hMin, hMax, wMin, wMax, fill, lit) {
  const r = rng(seed);
  let s = "", x = -40;
  while (x < GW + 40) {
    const w = wMin + r() * (wMax - wMin), h = hMin + r() * (hMax - hMin);
    const top = base - h;
    s += `<rect x="${x}" y="${top}" width="${w}" height="${h + 40}" fill="${fill}"/>`;
    if (r() < 0.3) {
      s += `<rect x="${x + w * 0.35}" y="${top - 40}" width="${w * 0.3}" height="40"
        fill="${fill}"/>`;
    }
    if (lit) {
      for (let wy = top + 18; wy < base - 10; wy += 22) {
        for (let wx = x + 10; wx < x + w - 14; wx += 18) {
          if (r() < lit) {
            s += `<rect x="${wx}" y="${wy}" width="8" height="11"
              fill="${r() < 0.75 ? "#F5C98F" : "#FAF7F4"}" opacity="${0.5 + r() * 0.4}"/>`;
          }
        }
      }
    }
    x += w + r() * 14;
  }
  return s;
}

let frames = "";
[0, 370, 740, 1110, GW].forEach((x) => {
  frames += `<rect x="${x - 9}" y="0" width="18" height="${GB}" fill="#14171C"/>`;
});
frames += `<rect x="0" y="132" width="${GW}" height="12" fill="#14171C"/>`;

document.getElementById("s").innerHTML = `
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#262C36"/>
    <stop offset=".45" stop-color="#4E5562"/>
    <stop offset=".72" stop-color="#B98C78"/>
    <stop offset=".85" stop-color="#F0C9A8"/>
    <stop offset="1" stop-color="#E8A04C"/>
  </linearGradient>
  <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D9D0C4"/><stop offset=".25" stop-color="#ECE5DB"/>
    <stop offset="1" stop-color="#F3EEE8"/>
  </linearGradient>
  <linearGradient id="reflect" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sconce" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#F5C98F" stop-opacity=".5"/>
    <stop offset="1" stop-color="#F5C98F" stop-opacity="0"/>
  </radialGradient>
  <filter id="far"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="mid"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="glass"><rect x="0" y="0" width="${GW}" height="${GB}"/></clipPath>
</defs>

<g clip-path="url(#glass)">
  <rect width="${GW}" height="${GB}" fill="url(#sky)"/>
  <g filter="url(#far)">${skyline(2, GB - 40, 140, 360, 70, 160, "#6A6E78", 0)}</g>
  <g filter="url(#mid)">${skyline(5, GB - 10, 120, 300, 90, 190, "#3A404A", 0.16)}</g>
  <g filter="url(#mid)">${skyline(9, GB + 20, 60, 190, 140, 260, "#23282F", 0.22)}</g>
  <rect width="${GW}" height="${GB}" fill="url(#reflect)"/>
  <path d="M200 0 L380 0 L120 ${GB} L-60 ${GB}Z" fill="#fff" opacity=".035"/>
  <path d="M900 0 L960 0 L700 ${GB} L640 ${GB}Z" fill="#fff" opacity=".03"/>
</g>
${frames}

<!-- interior column with the sign -->
<rect x="${GW + 9}" y="0" width="${1920 - GW}" height="1080" fill="url(#column)"/>
<rect x="${GW + 9}" y="0" width="14" height="1080" fill="rgba(20,23,28,.18)"
  filter="url(#soft)"/>
<ellipse cx="1700" cy="250" rx="300" ry="220" fill="url(#sconce)" opacity=".7"/>

<!-- low cabinet / sill across the bottom -->
<rect x="0" y="${GB - 16}" width="1920" height="30" fill="rgba(0,0,0,.4)"
  filter="url(#soft)"/>
<rect x="0" y="${GB}" width="1920" height="${1080 - GB}" fill="#2A2F37"/>
<rect x="0" y="${GB}" width="1920" height="12" fill="#3A404A"/>
${[480, 960, 1440].map((x) => `<rect x="${x - 1}" y="${GB + 20}" width="2"
  height="${1080 - GB}" fill="rgba(0,0,0,.35)"/>`).join("")}

<!-- plant and objects on the cabinet -->
${plant(190, GB - 96, 17, { height: 380, spread: 160, leaves: 32, size: 78,
  greens: ["#33492F", "#3F5A3C", "#4F6B4A", "#5E7D57"] })}
${pot(190, GB, 140, 100, "#14171C", "#23282F")}
${stack(1590, GB, 6, ["#E8A04C", "#14171C", "#5A6270"], 3)}
<path d="M1780 ${GB} Q1756 ${GB - 70} 1790 ${GB - 116} L1808 ${GB - 116}
  Q1842 ${GB - 70} 1818 ${GB}Z" fill="#E4DCD3"/>
`;

lockup({ x: 1548, y: 190, mark: 104 });
</script>
</body>
</html>
