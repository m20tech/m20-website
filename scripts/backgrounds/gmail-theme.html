<!doctype html>
<!--
  M20 Gmail theme generator. Render with scale 1.3333
  (2560x1440 PNG). ?v=ink | paper | ember picks the variant.

  Gmail lays its chrome over the whole image: the top bar, the left nav
  and the right add-on strip all sit directly on it. So each variant
  keeps one flat tone everywhere (no light/dark split) with only a
  low-contrast mesh texture; text stays legible wherever it lands.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"
  xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const variant = new URLSearchParams(location.search).get("v") || "ink";
const THEMES = {
  ink: {
    bg: ["#1A1E24", "#14171C"], warm: "#E8A04C", warmOp: 0.07,
    line: "rgba(213,217,225,0.06)", node: "rgba(213,217,225,0.13)",
    accents: ["#C0392B", "#E8A04C"], accentOp: 0.55,
  },
  paper: {
    bg: ["#FAF7F4", "#F3EEE8"], warm: "#F0C9A8", warmOp: 0.22,
    line: "rgba(90,98,112,0.09)", node: "rgba(90,98,112,0.17)",
    accents: ["#C0392B", "#E8A04C"], accentOp: 0.35,
  },
  ember: {
    bg: ["#96271C", "#7A1E15"], warm: "#E8A04C", warmOp: 0.10,
    line: "rgba(255,255,255,0.07)", node: "rgba(255,255,255,0.14)",
    accents: ["#F5C98F", "#E8A04C"], accentOp: 0.5,
  },
};
const t = THEMES[variant];

// Seeded PRNG so every render of a variant is identical.
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const r = rng(20);

let svg = `
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${t.bg[0]}"/>
      <stop offset="1" stop-color="${t.bg[1]}"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.78" cy="0.72" r="0.6">
      <stop offset="0" stop-color="${t.warm}" stop-opacity="${t.warmOp}"/>
      <stop offset="1" stop-color="${t.warm}" stop-opacity="0"/>
    </radialGradient>
    ${t.accents.map((c, k) => `
    <radialGradient id="glow${k}">
      <stop offset="0" stop-color="${c}" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="${c}" stop-opacity="0.16"/>
      <stop offset="1" stop-color="${c}" stop-opacity="0"/>
    </radialGradient>`).join("")}
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>`;

// Jittered grid triangulated into a mesh, echoing the site's hero network.
const S = 132, cols = Math.ceil(1920 / S) + 3, rows = Math.ceil(1080 / S) + 3;
const P = [];
for (let i = 0; i < cols; i++) {
  P[i] = [];
  for (let j = 0; j < rows; j++) {
    P[i][j] = {
      x: (i - 1) * S + (r() - 0.5) * S * 0.75,
      y: (j - 1) * S + (r() - 0.5) * S * 0.75,
    };
  }
}
let lines = "";
const seg = (a, b) => {
  lines += `M${a.x.toFixed(1)} ${a.y.toFixed(1)}L${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
};
for (let i = 0; i < cols; i++) {
  for (let j = 0; j < rows; j++) {
    if (i + 1 < cols) seg(P[i][j], P[i + 1][j]);
    if (j + 1 < rows) seg(P[i][j], P[i][j + 1]);
    if (i + 1 < cols && j + 1 < rows) {
      r() < 0.5 ? seg(P[i][j], P[i + 1][j + 1]) : seg(P[i + 1][j], P[i][j + 1]);
    }
  }
}
svg += `<path d="${lines}" stroke="${t.line}" stroke-width="1" fill="none"/>`;

// Nodes; a few become small accent glows, kept out of the left nav
// (x < 300) and top bar (y < 90) so nothing bright sits behind text.
for (let i = 0; i < cols; i++) {
  for (let j = 0; j < rows; j++) {
    const p = P[i][j];
    const accent = p.x > 420 && p.y > 150 && r() < 0.06;
    if (accent) {
      const k = r() < 0.6 ? 0 : 1, c = t.accents[k];
      svg += `<circle cx="${p.x}" cy="${p.y}" r="34" fill="url(#glow${k})"
        opacity="${t.accentOp}"/>`;
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3.2" fill="${c}"
        opacity="${t.accentOp}"/>`;
    } else {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="2.3" fill="${t.node}"/>`;
    }
  }
}
document.getElementById("s").innerHTML = svg;
</script>
</body>
</html>
