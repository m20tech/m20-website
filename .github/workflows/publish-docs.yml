# Republishes docs/website-guide.md to the "Website" Confluence page
# (https://m20tech.atlassian.net/wiki/x/AoCIcwE) after every merge to main.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CONFLUENCE_EMAIL      Atlassian account that can edit the page
#   CONFLUENCE_API_TOKEN  API token for that account (id.atlassian.com → Security → API tokens)
name: Publish website guide to Confluence

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check credentials
        id: creds
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          if [ -z "$CONFLUENCE_EMAIL" ] || [ -z "$CONFLUENCE_API_TOKEN" ]; then
            echo "::warning::CONFLUENCE_EMAIL / CONFLUENCE_API_TOKEN secrets are not set — skipping Confluence publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        env:
          CONFLUENCE_BASE_URL: https://m20tech.atlassian.net
          CONFLUENCE_PAGE_ID: "6233292802"
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: node scripts/publish-confluence.mjs
