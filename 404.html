<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
[[> head]]
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
    @media (max-width: 900px) { .case-cover { display: none !important; } .case-hero-text { max-width: none !important; } }
  </style>
</helmet>

<!-- Served by Cloudflare for any path with no page (wrangler.jsonc:
     not_found_handling "404-page"), with a 404 status, at whatever depth the
     missing URL was. Every href/src is root-relative so it works anywhere. -->
<div style="background:#FAF7F4;color:#14171C;font-family:'Source Sans 3', system-ui, sans-serif;font-size:17px;line-height:1.65;min-height:100vh;display:flex;flex-direction:column;">

  <dc-import name="Header" active-page="none" hint-size="100%,76px"></dc-import>

  <section style="position:relative;overflow:hidden;background:#14171C;color:#FAF7F4;padding-block:clamp(44px,5.5vw,72px);">
    [[#if hero.cover]]
    <div class="case-cover" style="position:absolute;top:0;bottom:0;left:max(520px, calc(50% - 140px));right:0;display:flex;align-items:center;pointer-events:none;">
      <img src="[[ hero.cover ]]" alt="" width="1200" height="630" style="display:block;width:104%;max-width:none;flex:none;height:auto;-webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 18%), linear-gradient(180deg, transparent 0%, #000 9%, #000 91%, transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg, transparent 0%, #000 18%), linear-gradient(180deg, transparent 0%, #000 9%, #000 91%, transparent 100%);mask-composite:intersect;">
    </div>
    [[/if]]
    <div style="position:relative;max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <div class="case-hero-text" style="max-width:min(620px, 60%);">
        <p style="font:600 13px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#E8A04C;display:flex;align-items:center;gap:12px;margin:0 0 18px;">
          <span style="width:34px;height:2px;background:#E8A04C;"></span>[[ hero.eyebrow ]]
        </p>
        <h1 style="font:700 clamp(34px,4.6vw,56px)/1.12 'Source Serif 4', Georgia, serif;color:#fff;margin:0 0 20px;letter-spacing:-0.01em;">
          [[ hero.title ]]
        </h1>
        <p style="color:#D5D9E1;margin:0 0 32px;max-width:560px;">
          [[ hero.text ]]
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:12px;">
          <a href="[[ hero.primaryCta.href ]]" style="display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 20px;font:600 15px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.02em;border-radius:999px;background:#C0392B;color:#fff;white-space:nowrap" style-hover="background:#96271C;box-shadow:0 8px 24px rgba(192,57,43,.28);">[[ hero.primaryCta.label ]]</a>
          <a href="[[ hero.secondaryCta.href ]]" style="display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 20px;font:600 15px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.02em;border-radius:999px;border:2px solid rgba(255,255,255,.85);color:#fff;background:rgba(20,23,28,.4);white-space:nowrap" style-hover="background:rgba(255,255,255,.14);border-color:#fff;">[[ hero.secondaryCta.label ]]</a>
        </div>
      </div>
    </div>
  </section>

  <section style="flex:1 0 auto;padding-block:clamp(40px,5vw,64px);">
    <div style="max-width:1180px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);">
      <p style="font:600 13px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C0392B;display:flex;align-items:center;gap:12px;margin:0 0 32px;">
        <span style="width:34px;height:2px;background:#C0392B;"></span>[[ links.eyebrow ]]
      </p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(20px,3vw,36px);">
        [[#each links.items]]
        <a href="[[ href ]]" style="display:flex;flex-direction:column;background:#fff;border:1px solid #E4DCD3;border-radius:22px;padding:36px 32px 30px;color:#14171C;transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease" style-hover="border-color:#C0392B;box-shadow:0 18px 40px rgba(20,23,28,.10);transform:translateY(-4px)">
          <h2 style="font:600 22px/1.25 'Source Serif 4', Georgia, serif;margin:0 0 10px;">[[ title ]]</h2>
          <p style="color:#5A6270;margin:0 0 20px;flex:1;">[[ text ]]</p>
          <span style="font:600 15px 'Source Sans 3', system-ui, sans-serif;color:#C0392B;">
            [[ links.linkLabel ]] <span aria-hidden="true">→</span>
          </span>
        </a>
        [[/each]]
      </div>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}

</script>
</body>
</html>
