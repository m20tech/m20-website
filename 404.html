<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
[[> head]]
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="reset">
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</helmet>

<!-- Served by Cloudflare for any path with no page (wrangler.jsonc:
     not_found_handling "404-page"), with a 404 status, at whatever depth the
     missing URL was. Every href/src is root-relative so it works anywhere. -->
<div style="background:#FAF7F4;color:#14171C;font-family:'Source Sans 3', system-ui, sans-serif;font-size:17px;line-height:1.65;min-height:100vh;display:flex;flex-direction:column;">

  <dc-import name="Header" active-page="none" hint-size="100%,76px"></dc-import>

  <section style="flex:1 0 auto;display:flex;align-items:center;padding-block:clamp(44px,5.5vw,72px);">
    <div style="max-width:640px;margin-inline:auto;padding-inline:clamp(20px,4vw,48px);text-align:center;">
      <p style="font:600 13px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C0392B;display:inline-flex;align-items:center;gap:12px;margin:0 0 18px;">
        <span style="width:34px;height:2px;background:#C0392B;"></span>[[ eyebrow ]]
      </p>
      <h1 style="font:700 clamp(34px,4.6vw,56px)/1.12 'Source Serif 4', Georgia, serif;margin:0 0 20px;letter-spacing:-0.01em;">
        [[ title ]]
      </h1>
      <p style="color:#5A6270;margin:0 0 32px;">
        [[ text ]]
      </p>
      <a href="[[ cta.href ]]" style="display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 20px;font:600 15px 'Source Sans 3', system-ui, sans-serif;letter-spacing:.02em;border-radius:999px;background:#C0392B;color:#fff;white-space:nowrap" style-hover="background:#96271C;box-shadow:0 8px 24px rgba(192,57,43,.28);">[[ cta.label ]]</a>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,180px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}

</script>
</body>
</html>
